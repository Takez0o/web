# Nasadí složku site/ na GitHub Pages.
# Spouští se po každé změně webu v main, ručně, nebo z workflow „Ovládání odpočtu“.
#
# Příprava a nasazení jsou dva samostatné joby: nasazení tak vždy najde hotový
# balík webu. Kdyby ho GitHub přesto ještě nezaevidoval, nasazení se jednou zopakuje.
name: Nasazení webu

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/nasazeni.yml"
  workflow_dispatch:
  workflow_call:

permissions: {}

jobs:
  priprava:
    name: Připravit web
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Stáhnout aktuální main
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Zabalit složku site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  nasazeni:
    name: Nasadit na GitHub Pages
    needs: priprava
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.druhy.outputs.page_url || steps.prvni.outputs.page_url }}
    steps:
      - name: Nastavit Pages
        uses: actions/configure-pages@v6

      - name: Nasadit
        id: prvni
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Počkat před druhým pokusem
        if: steps.prvni.outcome == 'failure'
        run: sleep 20

      - name: Nasadit (druhý pokus)
        id: druhy
        if: steps.prvni.outcome == 'failure'
        uses: actions/deploy-pages@v5
